name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Deploy on server
        run: |
          set -e
          cd /home/deploy/app/unu-project

          git fetch origin
          git checkout deploy
          git pull origin deploy

          git submodule sync --recursive
          git submodule update --init --recursive

          grep -v -E '^(SUPABASE_SERVICE_ROLE_KEY|ONLINE_LECTURE_ACCESS_CODE)=' .env > .env.tmp || true
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.tmp
          echo "ONLINE_LECTURE_ACCESS_CODE=${{ secrets.NEXT_PUBLIC_ONLINE_LECTURE_ACCESS_CODE }}" >> .env.tmp
          mv .env.tmp .env

          UPLOAD_BACKUP_DIR=""
          cleanup_upload_backup() {
            if [ -n "${UPLOAD_BACKUP_DIR:-}" ]; then
              rm -rf "$UPLOAD_BACKUP_DIR"
            fi
          }
          trap cleanup_upload_backup EXIT

          if docker container inspect unu_backend >/dev/null 2>&1; then
            UPLOAD_MOUNT="$(docker container inspect --format '{{range .Mounts}}{{if eq .Destination "/app/uploads"}}{{.Destination}}{{end}}{{end}}' unu_backend)"
            if [ -z "$UPLOAD_MOUNT" ]; then
              UPLOAD_BACKUP_DIR="$(mktemp -d)"
              docker cp unu_backend:/app/uploads/. "$UPLOAD_BACKUP_DIR/"
            fi
          fi

          docker compose pull
          docker compose up -d

          if [ -n "$UPLOAD_BACKUP_DIR" ]; then
            docker cp "$UPLOAD_BACKUP_DIR/." unu_backend:/app/uploads/
            docker exec -u 0 unu_backend chown -R 1001:1001 /app/uploads
          fi

          docker compose exec -T nginx nginx -t
          docker compose restart nginx

          docker compose ps

      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --data "{\"text\":\"✅ 배포 성공\nrepo: ${{ github.repository }}\nbranch: ${{ github.ref_name }}\nactor: ${{ github.actor }}\ncommit: ${{ github.sha }}\"}"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --data "{\"text\":\"❌ 배포 실패\nrepo: ${{ github.repository }}\nbranch: ${{ github.ref_name }}\nactor: ${{ github.actor }}\ncommit: ${{ github.sha }}\"}"
