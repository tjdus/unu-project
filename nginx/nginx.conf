upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:3000;
}

# 초당 요청 제한 (IP당) — 취약점 스캐너/봇의 대량 요청으로 백엔드가 과부하되는 것을 방지
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=application_access_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# ── HTTP → HTTPS Redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Certbot 인증용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# 실제 도메인이 아닌 Host 헤더(예: IP로 직접 접속하는 스캐너)는 업스트림까지 가지 않고 즉시 차단
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/cnu-nu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cnu-nu.com/privkey.pem;
    return 444;
}

# ── HTTPS Server ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name cnu-nu.com www.cnu-nu.com;

    # SSL 인증서 경로 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/cnu-nu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cnu-nu.com/privkey.pem;

    # SSL 보안 설정
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # modern configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (주석 해제하면 브라우저가 HTTPS만 사용하도록 강제)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # 업스트림(프론트/백엔드)이 죽어 있을 때 워커가 오래 붙잡히지 않도록 타임아웃을 짧게
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # 요청 폭주 시 즉시 튕기지 않고 큐잉 후 초과분만 거절
    limit_req  zone=general_limit burst=30 nodelay;
    limit_conn addr_limit 20;

    # 존재하지 않는 PHP 취약점 스캔 등은 프론트/백엔드로 전달하지 않고 즉시 차단
    location ~* \.(php|php[3457]?|phtml|asp|aspx|jsp|cgi|env)$ {
        return 444;
    }
    location ~* /(wp-login|wp-admin|wp-content|xmlrpc\.php|\.git|\.env|phpmyadmin) {
        return 444;
    }

    client_max_body_size 1M;

    location = /api/admin/lecture-reservations {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/admin/lecture-reservations/summary {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/online-lecture {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 지원서 조회·검증·수정·취소 경로의 반복 대입을 별도로 제한한다.
    location ~ ^/api/public/applications/(lookup|[0-9a-fA-F-]+(?:/(verify|cancel))?)$ {
        client_max_body_size 1M;
        limit_req zone=application_access_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API → Spring Boot ─────────────────────────────────────────────────────
    location /api/ {
        client_max_body_size 20M;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Everything else → Next.js ─────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
